<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  .topbar { display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid #1e1e1e; gap: 16px; flex-shrink: 0; }
  .topbar h1 { font-size: 18px; font-weight: 700; color: #6366f1; }
  .world-name { font-size: 14px; color: #aaa; }
  .topbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; background: #1e1e1e; border: 1px solid #333; }
  .badge.tension { border-color: #ef4444; color: #ef4444; }
  .badge.warmth { border-color: #4ade80; color: #4ade80; }
  .icon-btn { background: none; border: 1px solid #333; color: #aaa; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .icon-btn:hover { background: #1e1e1e; }

  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Left panel — agents */
  .panel-left { width: 220px; border-right: 1px solid #1e1e1e; overflow-y: auto; padding: 16px 12px; flex-shrink: 0; }
  .panel-left h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 12px; }
  .agent-card { padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; }
  .agent-card:hover { background: #1a1a1a; border-color: #2a2a2a; }
  .agent-card.selected { background: #1a1a1a; border-color: #6366f1; }
  .agent-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .mood-bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .mood-label { font-size: 10px; color: #666; width: 14px; }
  .mood-bar { flex: 1; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
  .mood-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
  .fill-anger { background: #ef4444; }
  .fill-sad { background: #60a5fa; }
  .fill-happy { background: #4ade80; }
  .fill-social { background: #a78bfa; }

  /* Center panel — scene */
  .panel-center { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .atmosphere-bar { padding: 10px 20px; font-size: 13px; color: #888; font-style: italic; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
  .conversation { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .message { max-width: 80%; }
  .message.you { align-self: flex-end; }
  .msg-speaker { font-size: 11px; color: #666; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .speak-btn { background: none; border: none; cursor: pointer; font-size: 11px; opacity: 0.4; padding: 0; line-height: 1; }
  .speak-btn:hover { opacity: 1; }
  .msg-action { font-size: 13px; color: #888; font-style: italic; margin-bottom: 2px; }
  .msg-text { font-size: 14px; line-height: 1.5; background: #1a1a1a; padding: 10px 14px; border-radius: 10px; border: 1px solid #2a2a2a; }
  .message.you .msg-text { background: #1e1b4b; border-color: #3730a3; }

  /* Input bar */
  .input-bar { padding: 16px 20px; border-top: 1px solid #1e1e1e; display: flex; gap: 10px; flex-shrink: 0; }
  .input-bar input { flex: 1; padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #e8e8e8; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #6366f1; }
  .action-btns { display: flex; gap: 6px; }
  .action-btn { padding: 8px 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #aaa; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .action-btn:hover { background: #222; }
  .send-btn { padding: 10px 20px; background: #6366f1; border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
  .send-btn:hover { background: #5254cc; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .mode-btn { padding: 8px 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #aaa; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .mode-btn:hover { background: #222; }
  .mode-btn.narrator { background: #1a1200; border-color: #a16207; color: #fbbf24; }
  .input-bar.narrator-mode { border-top-color: #a16207; }
  .input-bar.narrator-mode input { border-color: #a16207; background: #1a1200; }
  .input-bar.narrator-mode input:focus { border-color: #fbbf24; }
  .input-bar.narrator-mode .send-btn { background: #a16207; }
  .input-bar.narrator-mode .send-btn:hover { background: #854d0e; }
  .narrator-msg { background: #1a1200; border: 1px solid #a16207; border-radius: 10px; padding: 12px 16px; margin: 8px 0; font-style: italic; color: #fde68a; font-size: 13px; line-height: 1.6; }
  .narrator-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #a16207; margin-bottom: 6px; font-style: normal; }

  /* Right panel — event log */
  .panel-right { width: 220px; border-left: 1px solid #1e1e1e; overflow-y: auto; padding: 16px 12px; flex-shrink: 0; }
  .panel-right h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 12px; }
  .atm-meter { margin-bottom: 14px; }
  .atm-label { font-size: 12px; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .atm-bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  .atm-fill { height: 100%; border-radius: 3px; transition: width 0.8s; }
  .fill-tension { background: #ef4444; }
  .fill-noise { background: #f59e0b; }
  .fill-warmth { background: #4ade80; }
  .event-log { margin-top: 20px; }
  .event-log h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 10px; }
  .event-item { font-size: 12px; color: #666; margin-bottom: 6px; line-height: 1.4; }

  /* World selector overlay */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .overlay.hidden { display: none; }
  .modal { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 32px; width: 520px; max-height: 80vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 20px; }
  .modal textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #e8e8e8; font-size: 14px; resize: vertical; min-height: 80px; outline: none; font-family: inherit; }
  .modal textarea:focus { border-color: #6366f1; }
  .modal-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .modal-row label { font-size: 13px; color: #aaa; white-space: nowrap; }
  .modal-row input[type=range] { flex: 1; }
  .modal-row span { font-size: 13px; color: #6366f1; width: 24px; text-align: right; }
  .world-list { margin-bottom: 24px; }
  .world-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #111; border-radius: 8px; margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; }
  .world-item:hover { border-color: #6366f1; }
  .world-item-name { font-size: 14px; }
  .world-item-del { color: #666; font-size: 12px; padding: 2px 8px; border: 1px solid #333; border-radius: 4px; background: none; color: #888; cursor: pointer; }
  .world-item-del:hover { color: #ef4444; border-color: #ef4444; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>🌐 Sonder</h1>
  <span class="world-name" id="world-name">No world loaded</span>
  <div class="topbar-right">
    <span class="badge tension" id="badge-tension">Tension: —</span>
    <span class="badge warmth" id="badge-warmth">Warmth: —</span>
    <button class="icon-btn" onclick="showWorldModal()">⊕ New World</button>
    <button class="icon-btn" onclick="window.location='/settings'">⚙ Settings</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Left: agents -->
  <div class="panel-left">
    <h3>People</h3>
    <div id="agent-list"></div>
  </div>

  <!-- Center: scene -->
  <div class="panel-center">
    <div class="atmosphere-bar" id="atmosphere-text">Load a world to begin…</div>
    <div class="conversation" id="conversation"></div>
    <div class="input-bar" id="input-bar">
      <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
        <div class="action-btns" id="action-btns"></div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="mode-btn" id="mode-btn" onclick="toggleNarrator()" title="Switch between speaking and asking the narrator">💬 Speak</button>
          <input id="msg-input" placeholder="Say something to the room…" onkeydown="if(event.key==='Enter') sendMessage()" />
          <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: atmosphere + events -->
  <div class="panel-right">
    <h3>Atmosphere</h3>
    <div class="atm-meter">
      <div class="atm-label"><span>Tension</span><span id="val-tension">—</span></div>
      <div class="atm-bar"><div class="atm-fill fill-tension" id="bar-tension" style="width:0%"></div></div>
    </div>
    <div class="atm-meter">
      <div class="atm-label"><span>Noise</span><span id="val-noise">—</span></div>
      <div class="atm-bar"><div class="atm-fill fill-noise" id="bar-noise" style="width:0%"></div></div>
    </div>
    <div class="atm-meter">
      <div class="atm-label"><span>Warmth</span><span id="val-warmth">—</span></div>
      <div class="atm-bar"><div class="atm-fill fill-warmth" id="bar-warmth" style="width:0%"></div></div>
    </div>
    <div class="event-log">
      <h3>Events</h3>
      <div id="event-log"></div>
    </div>
  </div>
</div>

<!-- World modal -->
<div class="overlay hidden" id="world-modal">
  <div class="modal">
    <h2>Worlds</h2>
    <div class="world-list" id="world-list"></div>
    <h3 style="margin-bottom:12px; font-size:14px; color:#aaa;">Create new world</h3>
    <textarea id="scene-prompt" placeholder="Describe a scene… e.g. 'A pub after Liverpool lost 3-0. Some Chelsea fans are celebrating nearby.'"></textarea>
    <div class="modal-row">
      <label>Agents:</label>
      <input type="range" min="2" max="20" value="5" id="agent-count" oninput="document.getElementById('agent-count-val').textContent=this.value">
      <span id="agent-count-val">5</span>
    </div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="send-btn" style="flex:1" onclick="createWorld()" id="create-btn">Create World</button>
      <button class="action-btn" onclick="hideWorldModal()">Cancel</button>
    </div>
    <div id="create-status" style="margin-top:10px; font-size:13px; color:#888; max-height:160px; overflow-y:auto; line-height:1.8;"></div>
  </div>
</div>

<script>
let ws = null;
let currentWorld = null;
let wsReady = false;
let narratorMode = false;

function toggleNarrator() {
  narratorMode = !narratorMode;
  const btn = document.getElementById('mode-btn');
  const bar = document.getElementById('input-bar');
  const input = document.getElementById('msg-input');
  btn.textContent = narratorMode ? '🎭 Narrator' : '💬 Speak';
  btn.classList.toggle('narrator', narratorMode);
  bar.classList.toggle('narrator-mode', narratorMode);
  input.placeholder = narratorMode
    ? 'Ask the narrator… (e.g. "what is Steve thinking but not saying")'
    : 'Say something to the room…';
  input.focus();
}

function appendNarratorMessage(question, answer) {
  const conv = document.getElementById('conversation');
  const wrapper = document.createElement('div');
  const box = document.createElement('div');
  box.className = 'narrator-msg';

  const label = document.createElement('div');
  label.className = 'narrator-label';
  label.textContent = '🎭 Narrator';

  const q = document.createElement('div');
  q.style.cssText = 'color:#fbbf24; margin-bottom:6px; font-style:normal; font-size:12px;';
  q.textContent = 'You asked: ' + question;

  const a = document.createElement('div');
  a.className = 'narrator-answer';
  a.textContent = answer;

  box.appendChild(label);
  box.appendChild(q);
  box.appendChild(a);
  wrapper.appendChild(box);
  conv.appendChild(wrapper);
  conv.scrollTop = conv.scrollHeight;
  return a; // return answer node so we can update it
}

// ── WebSocket ──────────────────────────────────────────────────────────────

function connectWS(worldId) {
  if (ws) { ws.onclose = null; ws.close(); }
  wsReady = false;
  ws = new WebSocket(`ws://${location.host}/ws/${worldId}`);

  ws.onopen = () => { wsReady = true; setSending(false); };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'atmosphere') {
      updateAtmosphere(data);
    } else if (data.type === 'error') {
      appendMessage({ speaker: '⚠', text: data.message, action: null, timestamp: Date.now()/1000 });
    } else if (data.speaker) {
      appendMessage(data);
      logEvent(`${data.speaker} spoke`);
    }
  };

  ws.onclose = () => {
    wsReady = false;
    setTimeout(() => { if (currentWorld) connectWS(currentWorld.id); }, 2000);
  };
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentWorld) return;
  input.value = '';

  if (narratorMode) {
    const answerNode = appendNarratorMessage(text, 'asking…');
    fetch(`/api/worlds/${currentWorld.id}/narrator`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: text }),
    })
    .then(r => r.json())
    .then(data => { answerNode.textContent = data.answer || data.detail || 'No answer.'; })
    .catch(e => { answerNode.textContent = 'Error: ' + e.message; });
    return;
  }

  if (!wsReady) return;
  appendMessage({ speaker: 'You', text, action: null, timestamp: Date.now()/1000 });
  ws.send(JSON.stringify({ text }));
}

function triggerAgentTurn() {
  if (wsReady) ws.send(JSON.stringify({ text: '' }));
}

function setSending(v) {
  document.getElementById('send-btn').disabled = v;
}

// ── Voice assignment ──────────────────────────────────────────────────────────
// Maps agent name → { voice, pitch, rate } assigned when world loads.
const agentVoices = {};

// Feminine-leaning names heuristic (common English/international)
const FEMININE_NAMES = new Set([
  'emma','olivia','ava','isabella','sophia','mia','charlotte','amelia','harper','evelyn',
  'abigail','emily','elizabeth','sofia','ella','madison','scarlett','victoria','aria','grace',
  'chloe','penelope','layla','riley','zoey','nora','lily','eleanor','hannah','lillian',
  'addison','aubrey','ellie','stella','natalie','zoe','leah','hazel','violet','aurora',
  'savannah','audrey','brooklyn','bella','claire','skylar','lucy','paisley','everly','anna',
  'caroline','nova','genesis','emilia','kennedy','samantha','maya','willow','kinsley','naomi',
  'aaliyah','elena','sarah','ariana','allison','gabriella','alice','madelyn','cora','ruby',
  'eva','serenity','autumn','adeline','hailey','gianna','valentina','isla','eliana','quinn',
  'nevaeh','ivy','sadie','piper','lydia','alexa','josephine','emery','julia','delilah',
  'arianna','vivian','kaylee','sophie','brielle','madeline','peyton','rylee','clara','hadley',
  'melanie','mackenzie','reagan','adalynn','liliana','aubree','jade','katherine','isabelle',
  'natalia','raelynn','maria','lena','jess','jessica','kate','katie','amy','lisa','linda',
  'patricia','barbara','margaret','sandra','ashley','dorothy','kimberly','donna','carol',
  'michelle','amanda','melissa','deborah','stephanie','rebecca','sharon','laura','cynthia',
  'kathleen','amy','angela','shirley','anna','brenda','pamela','emma','nicole','helen',
  'samantha','katherine','christine','debra','rachel','carolyn','janet','catherine','maria',
  'heather','diane','julie','joyce','victoria','kelly','christina','lauren','joan','evelyn',
  'judith','olivia','cheryl','megan','andrea','ann','alice','jean','danielle','beverly',
  'tammy','denise','theresa','irene','jane','lori','marilyn','andrea','katelyn','sofia',
  'riya','priya','ananya','divya','pooja','neha','shreya','kavya','meera','nisha',
  'aisha','fatima','zara','layla','yasmin','nadia','sara','leila','amira','hana',
  'yuki','sakura','hana','mei','rin','akari','yuna','sora','nana','momo',
]);

function guessGender(name) {
  return FEMININE_NAMES.has(name.toLowerCase()) ? 'female' : 'male';
}

function buildAgentVoices(agents) {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return; // voices not loaded yet, will retry

  const maleVoices   = voices.filter(v => /male|man|guy|david|mark|daniel|james|george|thomas|alex|fred|bruce|ralph|junior|albert|bad|good|hysterical|organ|cellos|bells|boing|bubbles|deranged|trinoids|whisper|zarvox|pipe/i.test(v.name) && !/female|woman|girl/i.test(v.name));
  const femaleVoices = voices.filter(v => /female|woman|girl|samantha|victoria|karen|moira|tessa|fiona|veena|alice|amelie|anna|joana|ioana|lekha|luciana|milena|paulina|sara|soledad|yuna|kyoko|sin-ji|ting-ting|mei-jia|zosia|mariska|laura|monica|nora|ellen|claire|alva|ida|kanya|damayanti|yelda|xander|luca|reed|sandy|shelley|grandma|junior/i.test(v.name));

  // Fallback: split available voices in half
  const half = Math.floor(voices.length / 2);
  const fallbackMale   = voices.slice(0, half).length   ? voices.slice(0, half)   : voices;
  const fallbackFemale = voices.slice(half).length      ? voices.slice(half)      : voices;

  const pickVoice = (gender, idx) => {
    const pool = gender === 'female'
      ? (femaleVoices.length ? femaleVoices : fallbackFemale)
      : (maleVoices.length   ? maleVoices   : fallbackMale);
    return pool[idx % pool.length];
  };

  const genderCount = { male: 0, female: 0 };
  agents.forEach(a => {
    const gender = guessGender(a.name);
    const idx    = genderCount[gender]++;
    const voice  = pickVoice(gender, idx);
    const age    = a.age || 30;
    // Older → lower pitch, slower rate
    const pitch  = gender === 'female'
      ? Math.max(0.8, 1.3 - (age - 20) * 0.008)
      : Math.max(0.6, 1.0 - (age - 20) * 0.008);
    const rate   = Math.max(0.75, 1.05 - (age - 20) * 0.004);
    agentVoices[a.name] = { voice, pitch, rate };
  });
}

function speak(text, agentName) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const av = agentVoices[agentName];
  if (av) {
    if (av.voice) u.voice = av.voice;
    u.pitch = av.pitch;
    u.rate  = av.rate;
  } else {
    u.rate = 0.95;
  }
  window.speechSynthesis.speak(u);
}

function appendMessage(msg) {
  const conv = document.getElementById('conversation');
  const div = document.createElement('div');
  div.className = 'message' + (msg.speaker === 'You' ? ' you' : '');
  const speakable = [msg.action, msg.text].filter(Boolean).join(' ');

  const speakerRow = document.createElement('div');
  speakerRow.className = 'msg-speaker';
  speakerRow.textContent = msg.speaker;

  if (speakable) {
    const btn = document.createElement('button');
    btn.className = 'speak-btn';
    btn.title = 'Read aloud';
    btn.textContent = '🔊';
    btn.addEventListener('click', () => speak(speakable, msg.speaker));
    speakerRow.appendChild(btn);
  }

  div.appendChild(speakerRow);
  if (msg.action) {
    const a = document.createElement('div');
    a.className = 'msg-action';
    a.textContent = `*${msg.action}*`;
    div.appendChild(a);
  }
  if (msg.text) {
    const t = document.createElement('div');
    t.className = 'msg-text';
    t.textContent = msg.text;
    div.appendChild(t);
  }

  conv.appendChild(div);
  conv.scrollTop = conv.scrollHeight;
}

function updateAtmosphere(data) {
  document.getElementById('bar-tension').style.width = data.tension + '%';
  document.getElementById('bar-noise').style.width = data.noise + '%';
  document.getElementById('bar-warmth').style.width = data.warmth + '%';
  document.getElementById('val-tension').textContent = data.tension;
  document.getElementById('val-noise').textContent = data.noise;
  document.getElementById('val-warmth').textContent = data.warmth;
  document.getElementById('badge-tension').textContent = `Tension: ${data.tension}`;
  document.getElementById('badge-warmth').textContent = `Warmth: ${data.warmth}`;

  // Update agent mood bars
  if (data.agents) {
    data.agents.forEach(a => {
      const m = a.mood;
      ['anger','sadness','happiness','social_willingness'].forEach(k => {
        const el = document.getElementById(`mood-${a.name}-${k}`);
        if (el) el.style.width = m[k] + '%';
      });
    });
  }
}

function renderAgents(agentList) {
  const el = document.getElementById('agent-list');
  el.innerHTML = '';
  const actionBtns = document.getElementById('action-btns');
  actionBtns.innerHTML = '';

  agentList.forEach(a => {
    const m = a.mood;
    el.innerHTML += `
      <div class="agent-card" id="agent-${a.name}">
        <div class="agent-name">${a.name}</div>
        <div class="mood-bar-row"><span class="mood-label" title="Anger">😠</span><div class="mood-bar"><div class="mood-fill fill-anger" id="mood-${a.name}-anger" style="width:${m.anger}%"></div></div></div>
        <div class="mood-bar-row"><span class="mood-label" title="Sadness">😢</span><div class="mood-bar"><div class="mood-fill fill-sad" id="mood-${a.name}-sadness" style="width:${m.sadness}%"></div></div></div>
        <div class="mood-bar-row"><span class="mood-label" title="Happiness">😊</span><div class="mood-bar"><div class="mood-fill fill-happy" id="mood-${a.name}-happiness" style="width:${m.happiness}%"></div></div></div>
        <div class="mood-bar-row"><span class="mood-label" title="Social">💬</span><div class="mood-bar"><div class="mood-fill fill-social" id="mood-${a.name}-social_willingness" style="width:${m.social_willingness}%"></div></div></div>
      </div>`;

    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.textContent = `Whisper to ${a.name}`;
    btn.onclick = () => {
      document.getElementById('msg-input').value = `[to ${a.name}] `;
      document.getElementById('msg-input').focus();
    };
    actionBtns.appendChild(btn);
  });

  const silentBtn = document.createElement('button');
  silentBtn.className = 'action-btn';
  silentBtn.textContent = 'Stay silent';
  silentBtn.onclick = triggerAgentTurn;
  actionBtns.appendChild(silentBtn);
}

function logEvent(text) {
  const log = document.getElementById('event-log');
  const item = document.createElement('div');
  item.className = 'event-item';
  item.textContent = text;
  log.prepend(item);
  if (log.children.length > 30) log.lastChild.remove();
}

// ── World modal ────────────────────────────────────────────────────────────

async function showWorldModal() {
  document.getElementById('world-modal').classList.remove('hidden');
  const worlds = await fetch('/api/worlds').then(r => r.json());
  const list = document.getElementById('world-list');
  list.innerHTML = worlds.length ? '' : '<p style="color:#555;font-size:13px;margin-bottom:16px;">No saved worlds yet.</p>';
  worlds.forEach(w => {
    list.innerHTML += `
      <div class="world-item" onclick="loadWorld('${w.id}')">
        <span class="world-item-name">${w.name}</span>
        <button class="world-item-del" onclick="event.stopPropagation(); deleteWorld('${w.id}', this.parentElement)">Delete</button>
      </div>`;
  });
}

function hideWorldModal() {
  document.getElementById('world-modal').classList.add('hidden');
}

async function createWorld() {
  const prompt = document.getElementById('scene-prompt').value.trim();
  if (!prompt) return;
  const count = document.getElementById('agent-count').value;
  const btn = document.getElementById('create-btn');
  const status = document.getElementById('create-status');
  btn.disabled = true;
  status.style.color = '#888';
  status.innerHTML = '';

  try {
    const resp = await fetch('/api/worlds', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, agent_count: parseInt(count) })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete line
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const item = JSON.parse(line.slice(6));
        if (item.type === 'progress') {
          status.innerHTML += `<div>${item.message}</div>`;
          status.scrollTop = status.scrollHeight;
        } else if (item.type === 'done') {
          hideWorldModal();
          loadWorld(item.world.id, item.world);
          return;
        } else if (item.type === 'error') {
          throw new Error(item.message);
        }
      }
    }
  } catch(e) {
    status.innerHTML += `<div style="color:#f87171">✗ ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

async function loadWorld(id, worldData) {
  currentWorld = worldData || await fetch(`/api/worlds/${id}`).then(r => r.json());
  currentWorld.id = currentWorld.id || id;
  document.getElementById('world-name').textContent = currentWorld.name;
  document.getElementById('atmosphere-text').textContent = currentWorld.atmosphere;
  document.getElementById('conversation').innerHTML = '';
  (currentWorld.conversation || []).forEach(appendMessage);
  renderAgents(currentWorld.agents);
  // Assign distinct voices — retry after voiceschanged if not ready yet
  buildAgentVoices(currentWorld.agents);
  if (!Object.keys(agentVoices).length) {
    window.speechSynthesis.onvoiceschanged = () => buildAgentVoices(currentWorld.agents);
  }
  updateAtmosphere({ tension: currentWorld.tension, noise: currentWorld.noise, warmth: currentWorld.warmth });
  connectWS(currentWorld.id);
  hideWorldModal();
}

async function deleteWorld(id, el) {
  await fetch(`/api/worlds/${id}`, { method: 'DELETE' });
  el.remove();
}

fetch('/api/setup/needed').then(r => r.json()).then(d => {
  if (d.needed) window.location = '/onboarding';
});
