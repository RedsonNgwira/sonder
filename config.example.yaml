# Sonder Configuration
# Copy this to config.yaml and fill in your values

# LLM Provider (via LiteLLM)
# Examples:
#   anthropic/claude-sonnet-4-5
#   openai/gpt-4o
#   groq/llama-3.1-70b-versatile
#   ollama/llama3  (local, no API key needed)
model: ollama/qwen2.5:0.5b

# API key for your chosen provider (not needed for Ollama)
api_key: ""

# Optional: custom base URL (e.g. for self-hosted Ollama on another machine)
api_base: ""

# Simulation settings
max_agents: 20
simulation_tick_ms: 1500   # delay between agent turns in milliseconds

# Server settings
host: "0.0.0.0"
port: 8080
open_browser: true         # auto-open browser on first run

# Web search (optional, enriches agent behavior at world creation)
web_search_enabled: false
